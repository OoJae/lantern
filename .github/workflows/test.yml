# Proves the contract's circuit logic -- including every assert rejection path
# and the adversarial forged-witness cases -- with no Docker and no chain.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Exactly what a judge does: clone, install, test. No Compact toolchain on
  # the runner, so this passes only if the committed generated modules are
  # complete on their own.
  clean-clone:
    name: clean clone · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --no-audit --no-fund

      # One runtime instance, or StateValue objects from two copies of the
      # WASM stop being interchangeable (the override in package.json).
      - name: Assert a single onchain-runtime-v3
        run: |
          set -euo pipefail
          n=$(npm ls @midnight-ntwrk/onchain-runtime-v3 --all --parseable | sort -u | wc -l)
          test "$n" -eq 1 || { npm ls @midnight-ntwrk/onchain-runtime-v3 --all; exit 1; }

      - run: npm test
      # The adversarial demo is also an assertion: it exits non-zero if a
      # vulnerable target is NOT fully broken, or if the shipped one IS.
      - run: npm run attack -- --no-color
      # The whole story, as a terminal run; non-zero if any step goes unexpectedly.
      - run: npm run story -- --no-color --seed ci
      # The fee sponsor's policy. Dependency-free, so no devnet install is needed.
      # Unquoted: the shell expands the glob on every Node version.
      - run: node --test devnet/test/*.test.mjs

  # The same suite against modules freshly compiled from source.
  recompiled:
    name: recompiled from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci --no-audit --no-fund
      - run: bash scripts/compile.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run attack -- --no-color
