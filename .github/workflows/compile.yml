# Proves judging step 1 -- "we clone your repository and compile it" -- on a
# clean ubuntu-latest runner, before a judge ever clones.
name: compile

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: compact 0.31.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Seconds, and no keys: every committed module equals a fresh compile.
      - name: Fast check (no keys)
        run: bash scripts/compile.sh --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile contract
        run: bash scripts/compile.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert proving keys were generated
        run: |
          set -euo pipefail
          for c in enrollIdentity addGuardian rotateGuardianSet openRecovery approveRecovery vetoRecovery finalizeRecovery proveSuccession proveHeadOwnership hostGatedAction; do
            test -s "contracts/managed/keys/${c}.prover"   || { echo "missing prover key: $c";   exit 1; }
            test -s "contracts/managed/keys/${c}.verifier" || { echo "missing verifier key: $c"; exit 1; }
          done
          echo "all circuits produced prover + verifier keys"

      - name: Assert the independently deployed host compiled
        run: |
          set -euo pipefail
          for c in openEpoch attestVote sealEpoch \
                   openRotation rotateVote sealRotation requireCurrentOwnerAttested; do
            test -s "contracts/managed-host/keys/${c}.prover"   || { echo "missing host prover key: $c";   exit 1; }
            test -s "contracts/managed-host/keys/${c}.verifier" || { echo "missing host verifier key: $c"; exit 1; }
          done
          echo "host contract produced prover + verifier keys"

      - name: Assert pure circuits generate no proving key
        run: |
          set -euo pipefail
          # The derivation layer is `export pure circuit`, so the client calls
          # the same compiled code the circuit does. If one ever acquires a
          # .zkir it has stopped being pure and the parity guarantee is gone.
          for p in idCommitOf vetoCommitOf guardianLeafOf recoveryIdOf \
                   approvalNullifierOf vetoNullifierOf lineageLeafOf gateNullifierOf ephemeralPkOf; do
            if [ -e "contracts/managed/zkir/${p}.zkir" ]; then
              echo "::error::${p} is no longer a pure circuit"; exit 1
            fi
          done
          echo "all derivations are pure and key-free"

      - name: Assert the committed contract modules match source
        run: |
          set -euo pipefail
          dirs="contracts/managed/contract contracts/managed-host/contract \
                contracts/managed-public-guardians/contract contracts/managed-lantern-v0/contract"
          # Modified AND untracked: a new file in a fresh compile is drift too.
          if ! git diff --quiet -- $dirs || [ -n "$(git status --porcelain -- $dirs)" ]; then
            echo "::error::a committed contract module is stale. Run 'npm run compile' and commit."
            git status --porcelain -- $dirs
            git diff --stat -- $dirs
            exit 1
          fi
          echo "all four committed contract modules are byte-identical to a fresh compile"

      # Fails unless exactly 17 circuits parse, each at k <= 14.
      - name: Assert every circuit fits k <= 14
        run: node scripts/check-cost.mjs
