# Proves judging step 1 -- "we clone your repository and compile it" -- on a
# clean ubuntu-latest runner, before a judge ever clones.
name: compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: compact 0.31.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile contract
        run: bash scripts/compile.sh

      - name: Assert proving keys were generated
        run: |
          set -euo pipefail
          for c in enrollIdentity addGuardian rotateGuardianSet openRecovery approveRecovery vetoRecovery finalizeRecovery proveSuccession proveHeadOwnership; do
            test -s "contracts/managed/keys/${c}.prover"   || { echo "missing prover key: $c";   exit 1; }
            test -s "contracts/managed/keys/${c}.verifier" || { echo "missing verifier key: $c"; exit 1; }
          done
          echo "all circuits produced prover + verifier keys"

      - name: Assert pure circuits generate no proving key
        run: |
          set -euo pipefail
          # The derivation layer is `export pure circuit`, so the client calls
          # the same compiled code the circuit does. If one ever acquires a
          # .zkir it has stopped being pure and the parity guarantee is gone.
          for p in idCommitOf vetoCommitOf guardianLeafOf recoveryIdOf \
                   approvalNullifierOf vetoNullifierOf lineageLeafOf; do
            if [ -e "contracts/managed/zkir/${p}.zkir" ]; then
              echo "::error::${p} is no longer a pure circuit"; exit 1
            fi
          done
          echo "all derivations are pure and key-free"

      - name: Assert the committed contract module matches source
        run: |
          set -euo pipefail
          if ! git diff --quiet -- contracts/managed/contract; then
            echo "::error::contracts/managed/contract is stale. Run 'npm run compile' and commit."
            git diff --stat -- contracts/managed/contract
            exit 1
          fi
          echo "committed contract module is byte-identical to a fresh compile"
