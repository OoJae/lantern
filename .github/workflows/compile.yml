# Proves judging step 1 -- "we clone your repository and compile it" -- on a
# clean ubuntu-latest runner, before a judge ever clones.
name: compile

on:
  # Docs-only changes skip this job, except the two documents whose tables the cost steps
  # compare with the measurement: README.md (the circuit table, through scripts/check-cost.mjs)
  # and docs/v2.md (§8 and §14.1, through scripts/check-cost-v2.mjs).
  # The patterns apply in order, so the last two bring those documents back.
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', 'README.md', 'docs/v2.md']
  pull_request:
    paths: ['**', '!**.md', '!docs/**', 'README.md', 'docs/v2.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: compact 0.31.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Seconds, and no keys: every committed module equals a fresh compile.
      - name: Fast check (no keys)
        run: bash scripts/compile.sh --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same, for Lantern v2 alone (npm run compile:check:v2), so a v2
      # drift is named in its own step.
      - name: Fast check, Lantern v2 (no keys)
        run: bash scripts/compile.sh --check-v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile contract
        run: bash scripts/compile.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert proving keys were generated
        run: |
          set -euo pipefail
          for c in enrollIdentity addGuardian rotateGuardianSet openRecovery approveRecovery vetoRecovery finalizeRecovery proveSuccession proveHeadOwnership hostGatedAction; do
            test -s "contracts/managed/keys/${c}.prover"   || { echo "missing prover key: $c";   exit 1; }
            test -s "contracts/managed/keys/${c}.verifier" || { echo "missing verifier key: $c"; exit 1; }
          done
          echo "all circuits produced prover + verifier keys"

      - name: Assert the independently deployed host compiled
        run: |
          set -euo pipefail
          for c in openEpoch attestVote sealEpoch \
                   openRotation rotateVote sealRotation requireCurrentOwnerAttested; do
            test -s "contracts/managed-host/keys/${c}.prover"   || { echo "missing host prover key: $c";   exit 1; }
            test -s "contracts/managed-host/keys/${c}.verifier" || { echo "missing host verifier key: $c"; exit 1; }
          done
          echo "host contract produced prover + verifier keys"

      - name: Assert pure circuits generate no proving key
        run: |
          set -euo pipefail
          # The derivation layer is `export pure circuit`, so the client calls
          # the same compiled code the circuit does. If one ever acquires a
          # .zkir it has stopped being pure and the parity guarantee is gone.
          for p in idCommitOf vetoCommitOf guardianLeafOf recoveryIdOf \
                   approvalNullifierOf vetoNullifierOf lineageLeafOf gateNullifierOf ephemeralPkOf; do
            if [ -e "contracts/managed/zkir/${p}.zkir" ]; then
              echo "::error::${p} is no longer a pure circuit"; exit 1
            fi
          done
          echo "all derivations are pure and key-free"

      - name: Assert Lantern v2 compiled, with every derivation pure
        run: |
          set -euo pipefail
          for c in enrollIdentity addGuardian rotateGuardianSet openRecovery approveRecovery vetoRecovery \
                   finalizeRecovery proveSuccession proveHeadOwnership hostGatedAction \
                   lockIdentity unlockIdentity checkIn; do
            test -s "contracts/managed-lantern2/keys/${c}.prover"   || { echo "missing v2 prover key: $c";   exit 1; }
            test -s "contracts/managed-lantern2/keys/${c}.verifier" || { echo "missing v2 verifier key: $c"; exit 1; }
          done
          for p in idCommitOf vetoCommitOf guardianLeafOf recoveryIdOf approvalNullifierOf vetoNullifierOf \
                   lineageLeafOf gateNullifierOf ephemeralPkOf openNullifierOf checkInNullifierOf checkInKeyOf \
                   guardianCtxOf cooldownSecondsOf openSlackSeconds vetoSlackSeconds; do
            if [ -e "contracts/managed-lantern2/zkir/${p}.zkir" ]; then
              echo "::error::v2 ${p} is no longer a pure circuit"; exit 1
            fi
          done
          echo "v2: 13 circuits with keys, every derivation pure and key-free"

      - name: Assert the committed contract modules match source
        run: |
          set -euo pipefail
          dirs="contracts/managed/contract contracts/managed-host/contract contracts/managed-lantern2/contract \
                contracts/managed-public-guardians/contract contracts/managed-lantern-v0/contract"
          # Modified AND untracked: a new file in a fresh compile is drift too.
          if ! git diff --quiet -- $dirs || [ -n "$(git status --porcelain -- $dirs)" ]; then
            echo "::error::a committed contract module is stale. Run 'npm run compile' and commit."
            git status --porcelain -- $dirs
            git diff --stat -- $dirs
            exit 1
          fi
          echo "all five committed contract modules are byte-identical to a fresh compile"

      # Fails unless exactly 17 circuits parse, each at k <= 14.
      - name: Assert every circuit fits k <= 14
        run: node scripts/check-cost.mjs

      # v2's 13 circuits, each at k <= 14 and equal to the table in docs/v2.md §8.
      - name: Assert every v2 circuit fits k <= 14
        run: node scripts/check-cost-v2.mjs

      # /live compares the verifier keys on Preprod with the SHA-256 pinned in web/src/live/keys.js.
      # The keys are not committed, so the pins must be this fresh compile's, none extra: the shipped
      # build's 17 and Lantern v2's 13 (/live checks deployments/preprod-v2.json too).
      - name: Assert /live's pinned key hashes are a fresh compile's
        run: node scripts/check-live-keys.mjs

      # /live checks the whole story's contract on Preprod against web/src/live/keys.js, which pins the
      # one key that run does not share with the committed build: the 60-second flavour's
      # finalizeRecovery. Build that flavour afresh, and the pin must be its key.
      - name: Assert /live's pinned flavour key is a fresh flavour build's
        run: |
          set -euo pipefail
          bash devnet/compile.sh
          sha=$(shasum -a 256 devnet/build/lantern/keys/finalizeRecovery.verifier | cut -d' ' -f1)
          grep -q "sha: '${sha}'" web/src/live/keys.js \
            || { echo "::error::web/src/live/keys.js does not pin the flavour build's finalizeRecovery key (${sha})"; exit 1; }
          echo "web/src/live/keys.js pins the flavour build's finalizeRecovery key: ${sha}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
