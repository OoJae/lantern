# A single-node local Midnight chain: node, indexer, proof server.
# Adapted from onepledge's local-devnet (itself after midnightntwrk/example-zkloan, Apache-2.0).
#
# Network id 'undeployed'. The dev preset mints all NIGHT to the well-known genesis seed
# 0x…01, which exists only on this local chain. No container_name, so these never collide
# with another project's stopped containers.
name: lantern-devnet

services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:${LANTERN_PROOF_SERVER_PORT:-6300}:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: 'midnightntwrk/indexer-standalone:4.3.3'
    # Without both of these the indexer exits on its own about five minutes in:
    # its SPO-node client gives up reconnecting after the default max delay.
    restart: unless-stopped
    ports:
      - '127.0.0.1:${LANTERN_INDEXER_PORT:-8088}:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
      APP__INFRA__SPO_NODE__RECONNECT_MAX_DELAY: '24h'
      # Local-only dev credentials, as in Midnight's own standalone example.
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.0'
    ports:
      - '127.0.0.1:${LANTERN_NODE_PORT:-9944}:9944'
    healthcheck:
      # Gate on block #1 existing, not merely on the RPC port answering: the indexer
      # resolves block #1 on startup and exits if the node is still at genesis.
      test:
        [
          'CMD-SHELL',
          'curl -sf -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"chain_getBlockHash\",\"params\":[1]}" http://localhost:9944 | grep -q "\"result\":\"0x"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
